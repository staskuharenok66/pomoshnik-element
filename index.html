<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<title>Помощник продавца</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --text:#1c2333; --muted:#6b7486;
  --accent:#4f6df5; --accent-soft:#e8edff; --border:#e3e7f0; --shadow:0 2px 10px rgba(28,35,51,.08);
  --danger:#e5484d; --radius:16px; --gap:12px; --pad:12px; --maxw:760px;
}
[data-theme="dark"]{
  --bg:#070b14; --card:#0f1626; --text:#dfe7f5; --muted:#8b99b5;
  --accent:#5b8cff; --accent-soft:#16233f; --border:#1e2b47; --shadow:0 2px 12px rgba(0,0,0,.5);
  --danger:#ff6369;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;min-height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) 90px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:none;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.active-sort{background:var(--accent);color:#fff;border-color:var(--accent)}
.icon-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs{display:flex;gap:8px;margin:10px 0 0;width:100%}
.tab{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.search-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:14px;font-size:16px;background:var(--card);color:var(--text);outline:none;margin-top:10px}
.search-input:focus{border-color:var(--accent)}
.filters-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.filter-select{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);outline:none}

/* Плитки категорий */
#catsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
@media (min-width:600px){#catsGrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){#catsGrid{grid-template-columns:repeat(4,1fr)}}
.cat-tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px 12px;text-align:center;cursor:pointer;border:1px solid var(--border);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cat-tile .emoji{font-size:42px;line-height:1}
.cat-tile .name{font-size:14px;font-weight:700;overflow-wrap:anywhere}

/* Экран категории и справочника */
#categoryView,#glossaryView{display:none}
.back-btn{background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:6px}
.cat-title{font-size:20px;font-weight:700;margin:6px 0 10px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}

/* Диалоги */
.dlg{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,20,35,.5)}
.dlg.show{display:flex}
.dlg-box{background:var(--card);border-radius:16px;padding:20px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3);max-height:90dvh;overflow-y:auto}
.dlg-box h3{font-size:18px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;outline:none;background:var(--card);color:var(--text)}
.field textarea{min-height:80px;resize:vertical}
.field textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:180px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.check-row{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:14px;cursor:pointer}
.check-row input{width:18px;height:18px;accent-color:var(--accent)}
.dlg-actions{display:flex;gap:10px;margin-top:14px}
.dlg-actions .btn{flex:1}

/* Тосты */
#toasts{position:fixed;left:0;right:0;bottom:20px;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateY(0)}

/* Карточки товаров */
.product-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;cursor:pointer;border:1px solid var(--border)}
.product-card .img{width:100%;height:180px;object-fit:cover;display:block;background:#ddd}
.product-card .placeholder{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--accent-soft)}
.product-card .body{padding:12px 14px}
.product-card h3{font-size:16px;margin-bottom:4px}
.product-card .brand{font-size:13px;color:var(--muted);margin-bottom:4px}
.product-card .price{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px}
.product-card .short{font-size:14px;color:var(--muted);line-height:1.5}
.product-card .details{display:none;padding:10px 14px 14px;border-top:1px solid var(--border)}
.product-card.open .details{display:block}
.spec-group{margin-top:10px}
.spec-group:first-child{margin-top:0}
.spec-group h4{font-size:13px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.spec-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px}
.spec-row:last-child{border-bottom:none}
.spec-row > span:last-child{text-align:right}

/* Ссылка-термин внутри описания и характеристик */
.term-link{
  display:inline;
  background:var(--accent-soft);
  color:var(--accent);
  border:none;
  border-bottom:1.5px dashed var(--accent);
  border-radius:6px;
  padding:1px 6px;
  font:inherit;
  font-weight:600;
  cursor:pointer;
  line-height:1.35;
}
.term-link:active{opacity:.75}

/* Справочник и бейджи */
.badges-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.brand-badge{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.glossary-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--border)}
.glossary-card .g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.glossary-card h3{font-size:16px;font-weight:700}
.glossary-card .aliases{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.glossary-card .short{font-size:14px;color:var(--muted)}
.glossary-card .g-details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:14px;white-space:pre-line}
.glossary-card.open .g-details{display:block}
.card-actions{display:flex;gap:8px;margin-top:12px}
.term-modal-short{font-size:15px;font-weight:500;margin-bottom:10px}
.term-modal-details{font-size:14px;color:var(--muted);white-space:pre-line;padding-top:10px;border-top:1px dashed var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Помощник продавца</h1>
      <button class="icon-btn" id="themeBtn" title="Сменить тему">🌙</button>
      <button class="btn secondary small" id="loginBtn">Войти</button>
      <button class="btn secondary small" id="logoutBtn" style="display:none">Выйти</button>
    </div>
    <div class="tabs" id="mainTabs">
      <button class="tab active" data-tab="home">Главная</button>
      <button class="tab" data-tab="glossary">Справочник</button>
    </div>
  </header>

  <!-- ГЛАВНАЯ: плитки категорий -->
  <div id="homeView">
    <div class="view-actions">
      <button class="btn small" id="addCatBtn" style="display:none">+ Категория</button>
    </div>
    <div id="catsGrid"></div>
  </div>

  <!-- ЭКРАН КАТЕГОРИИ -->
  <div id="categoryView">
    <button class="back-btn" id="backBtn">← Назад</button>
    <div class="cat-title" id="catTitle"></div>

    <div class="view-actions">
      <button class="btn small" id="addProductBtn" style="display:none">+ Товар</button>
    </div>

    <input type="search" id="prodSearch" class="search-input" placeholder="Поиск по названию или бренду..." autocomplete="off">

    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="btn secondary small" id="sortPriceAsc">Цена ↑</button>
      <button class="btn secondary small" id="sortPriceDesc">Цена ↓</button>
    </div>

    <div id="productsList" style="margin-top:12px"></div>
  </div>

  <!-- СПРАВОЧНИК -->
  <div id="glossaryView">
    <div class="view-actions">
      <button class="btn small" id="addGlossaryBtn" style="display:none">+ Термин</button>
      <button class="btn secondary small" id="importGlossaryBtn" style="display:none">📥 Импорт</button>
      <button class="btn secondary small" id="exportGlossaryBtn" style="display:none">📤 Экспорт</button>
    </div>
    <input type="search" id="glossarySearch" class="search-input" placeholder="Поиск термина, синонима или описания..." autocomplete="off">
    <div class="filters-row">
      <select class="filter-select" id="glossaryCatFilter">
        <option value="all">Все категории товаров</option>
      </select>
      <select class="filter-select" id="glossaryBrandFilter">
        <option value="all">Все бренды</option>
      </select>
    </div>
    <div id="glossaryList" style="margin-top:12px"></div>
  </div>
</div>

<!-- Диалог категории -->
<div class="dlg" id="catDlg">
  <div class="dlg-box">
    <h3>Новая категория</h3>
    <div class="field">
      <label>Название</label>
      <input type="text" id="catName" placeholder="Телевизоры">
    </div>
    <div class="field">
      <label>Эмодзи</label>
      <input type="text" id="catEmoji" placeholder="📺" maxlength="4">
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="catCancel">Отмена</button>
      <button class="btn" id="catSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Диалог входа -->
<div class="dlg" id="loginDlg">
  <div class="dlg-box">
    <h3>Вход для администратора</h3>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="loginCancel">Отмена</button>
      <button class="btn" id="loginSubmit">Войти</button>
    </div>
  </div>
</div>

<!-- Диалог товара -->
<div class="dlg" id="prodDlg">
  <div class="dlg-box">
    <h3 id="prodDlgTitle">Новый товар</h3>
    <div class="field">
      <label>Ссылка на фото (ImgBB)</label>
      <input type="text" id="pImage" placeholder="https://i.ibb.co/...">
    </div>
    <div class="field">
      <label>Название</label>
      <input type="text" id="pName" placeholder="LG OLED C4 55&quot;">
    </div>
    <div class="field">
      <label>Бренд</label>
      <input type="text" id="pBrand" list="brandsList" placeholder="LG">
    </div>
    <div class="field">
      <label>Цена (необязательно)</label>
      <input type="number" id="pPrice" placeholder="49990">
    </div>
    <div class="field">
      <label>Краткое описание</label>
      <textarea id="pShort" placeholder="4K OLED, 120 Гц, Game Mode"></textarea>
    </div>
    <div class="field">
      <label>Характеристики (каждая с новой строки: Группа | Ключ | Значение)</label>
      <textarea id="pSpecs" style="min-height:120px" placeholder="Экран | Тип матрицы | OLED&#10;Игры | Режим | Game Mode&#10;Звук | Мощность | 40 Вт"></textarea>
      <div class="hint" style="font-size:12.5px;color:var(--muted);margin-top:4px">Пример: <code>Экран | Тип матрицы | OLED</code></div>
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="prodCancel">Отмена</button>
      <button class="btn" id="prodSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Диалог добавления/редактирования термина -->
<div class="dlg" id="glossaryDlg">
  <div class="dlg-box">
    <h3 id="gDlgTitle">Новый термин</h3>
    <div class="field">
      <label>Термин (как в характеристиках)</label>
      <input type="text" id="gTitle" placeholder="OLED">
    </div>
    <div class="field">
      <label>Синонимы / варианты написания (через запятую)</label>
      <input type="text" id="gAliases" placeholder="OLED evo, Self-lit OLED">
    </div>
    <div class="field">
      <label>Категория товара</label>
      <select id="gCatId">
        <option value="">Общее (для всех категорий)</option>
      </select>
    </div>
    <div class="field">
      <label>Бренд (пусто = общий для любого бренда)</label>
      <input type="text" id="gBrand" list="brandsList" placeholder="LG или Samsung">
    </div>
    <div class="field">
      <label>Кратко простыми словами (для клиента)</label>
      <textarea id="gShort" placeholder="Матрица на органических светодиодах с бесконечной контрастностью и идеальным чёрным цветом."></textarea>
    </div>
    <div class="field">
      <label>Подробности / фишки бренда</label>
      <textarea id="gDetails" style="min-height:110px" placeholder="У LG используются самоподсвечивающиеся пиксели (WRGB)..."></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="gCancel">Отмена</button>
      <button class="btn" id="gSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Диалог импорта JSON -->
<div class="dlg" id="importDlg">
  <div class="dlg-box">
    <h3>Импорт терминов из JSON</h3>
    <div style="margin-bottom:12px">
      <button type="button" class="btn secondary small" id="copyAiPromptBtn" style="width:100%">🤖 Скопировать промпт-инструкцию для ИИ</button>
    </div>
    <div class="field">
      <label>Загрузить .json файл (необязательно)</label>
      <input type="file" id="importFile" accept=".json,application/json">
    </div>
    <div class="field">
      <label>Категория по умолчанию (если не указана в JSON)</label>
      <select id="importDefaultCat">
        <option value="">Общее (если не указано в JSON)</option>
      </select>
    </div>
    <div class="field">
      <label>Бренд по умолчанию (если не указан в JSON)</label>
      <input type="text" id="importDefaultBrand" list="brandsList" placeholder="Например: LG (можно оставить пустым)">
    </div>
    <label class="check-row">
      <input type="checkbox" id="importUpdateExisting" checked>
      <span>Обновлять совпадающие термины (без дубликатов)</span>
    </label>
    <div class="field">
      <label>Вставьте JSON сюда</label>
      <textarea id="importJson" class="mono" placeholder='[&#10;  {&#10;    "title": "OLED",&#10;    "aliases": "OLED evo",&#10;    "category": "Телевизоры",&#10;    "brand": "LG",&#10;    "shortDesc": "Кратко для клиента...",&#10;    "details": "Подробно..."&#10;  }&#10;]'></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="importCancel">Отмена</button>
      <button class="btn" id="importRun">Импортировать</button>
    </div>
  </div>
</div>

<!-- Диалог экспорта JSON -->
<div class="dlg" id="exportDlg">
  <div class="dlg-box">
    <h3>Экспорт справочника (JSON)</h3>
    <div class="field">
      <label>Все термины (<span id="exportCount">0</span>)</label>
      <textarea id="exportJson" class="mono" readonly></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="exportCopy">📋 Скопировать</button>
      <button class="btn" id="exportDownload">💾 Скачать .json</button>
    </div>
    <div class="dlg-actions" style="margin-top:8px">
      <button class="btn secondary" id="exportClose">Закрыть</button>
    </div>
  </div>
</div>

<!-- Окно просмотра термина при клике на характеристику -->
<div class="dlg" id="termViewDlg">
  <div class="dlg-box">
    <h3 id="tvTitle"></h3>
    <div class="badges-row" id="tvBadges"></div>
    <div class="term-modal-short" id="tvShort"></div>
    <div class="term-modal-details" id="tvDetails"></div>
    <div class="dlg-actions">
      <button class="btn" id="tvClose">Закрыть</button>
    </div>
  </div>
</div>

<datalist id="brandsList"></datalist>
<div id="toasts"></div>

<script type="module">
// ============================================
// 1. FIREBASE CONFIG
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyDEHif3aB05Q7afZYdx4AE66qNH4ObnhhY",
  authDomain: "pomoshnik-prodavca.firebaseapp.com",
  projectId: "pomoshnik-prodavca",
  storageBucket: "pomoshnik-prodavca.firebasestorage.app",
  messagingSenderId: "493490305518",
  appId: "1:493490305518:web:7679490e482b066c3276ff",
  measurementId: "G-EB23E29XVW"
};
const ADMIN_UID = "j3qe8ZSSYzb6cR3mZ6BfvPX8yrB2";

// ============================================
// 2. ИМПОРТЫ
// ============================================
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, writeBatch, query, where, enableIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});

// ============================================
// 3. СОСТОЯНИЕ
// ============================================
let categories = [];
let currentCat = null;
let isAdmin = false;
let glossary = [];
let products = [];

// ============================================
// 4. УТИЛИТЫ
// ============================================
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 2500);
}
function genId(prefix='c'){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function getCatLabel(catId){
  if(!catId) return 'Общее';
  const c = categories.find(x=>x.id===catId);
  return c ? `${c.emoji} ${c.name}` : 'Категория';
}
async function copyText(text, okMsg='Скопировано'){
  try{
    await navigator.clipboard.writeText(text);
    toast(okMsg);
    return true;
  }catch{
    return false;
  }
}

function updateBrandsDatalist(){
  const brands = new Set();
  glossary.forEach(g=>{ if(g.brand.trim()) brands.add(g.brand.trim()); });
  products.forEach(p=>{ if(p.brand.trim()) brands.add(p.brand.trim()); });
  const list = [...brands].sort((a,b)=>a.localeCompare(b, 'ru'));

}

// ============================================
// 5. МАТЧИНГ ТЕРМИНОВ ПО КАТЕГОРИИ И БРЕНДУ
// ============================================
function isWordBoundaryChar(ch){
  if(!ch) return true;
  return !/[\p{L}\p{N}]/u.test(ch);
}

function buildTermMatcher(productBrand, productCatId){
  const bNorm = (productBrand || '').trim().toLowerCase();
  const cId = productCatId || '';
  const bestByPhrase = new Map();

  glossary.forEach(term=>{
    const tBrand = (term.brand || '').trim().toLowerCase();
    const tCat = term.categoryId || '';

    if(tBrand && tBrand !== bNorm) return;
    if(tCat && tCat !== cId) return;

    let priority = 1;
    if(tBrand && tCat) priority = 4;
    else if(tBrand && !tCat) priority = 3;
    else if(!tBrand && tCat) priority = 2;

    const phrases = [term.title, ...(term.aliases ? term.aliases.split(',') : [])]
      .map(s=>s.trim())
      .filter(Boolean);

    phrases.forEach(rawPhrase=>{
      const key = rawPhrase.toLowerCase();
      const prev = bestByPhrase.get(key);
      if(!prev || priority > prev.priority){
        bestByPhrase.set(key, { phraseLower: key, term, priority });
      }
    });
  });

  return [...bestByPhrase.values()].sort((a,b)=>b.phraseLower.length - a.phraseLower.length);
}

function linkifyText(text, matcher){
  const str = String(text ?? '');
  if(!str || !matcher.length) return esc(str);

  const lower = str.toLowerCase();
  let out = '';
  let plainStart = 0;
  let pos = 0;

  while(pos < str.length){
    let matched = null;
    for(const item of matcher){
      const len = item.phraseLower.length;
      if(lower.startsWith(item.phraseLower, pos)){
        const beforeOk = isWordBoundaryChar(pos === 0 ? '' : str[pos - 1]);
        const afterOk = isWordBoundaryChar(pos + len >= str.length ? '' : str[pos + len]);
        if(beforeOk && afterOk){
          matched = item;
          break;
        }
      }
    }

    if(matched){
      if(pos > plainStart) out += esc(str.slice(plainStart, pos));
      const matchedText = str.slice(pos, pos + matched.phraseLower.length);
      out += `<button type="button" class="term-link" data-tid="${esc(matched.term.id)}">${esc(matchedText)}</button>`;
      pos += matched.phraseLower.length;
      plainStart = pos;
    }else{
      pos++;
    }
  }

  if(plainStart < str.length) out += esc(str.slice(plainStart));
  return out;
}

}

async function loadProducts(catId){
  try{
    const q = query(collection(db, 'products'), where('categoryId', '==', catId));
    const snapshot = await getDocs(q);
    products = [];
    snapshot.forEach(d=>{
      const x = d.data();
      products.push({
        id: d.id,
        categoryId: x.categoryId || catId,
        name: x.name||'',
        brand: x.brand||'',
        price: x.price ?? null,
        imageUrl: x.imageUrl||'',
        shortDesc: x.shortDesc||'',
        specs: Array.isArray(x.specs) ? x.specs : []
      });
    });
    updateBrandsDatalist();
    renderProducts();
  }catch(e){
    console.error(e);
    toast('Ошибка загрузки товаров');
  }
}

function parseSpecs(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length >= 3) return { group: parts[0], key: parts[1], value: parts.slice(2).join(' ') };
    if(parts.length === 2) return { group: 'Общее', key: parts[0], value: parts[1] };
    return { group: 'Общее', key: parts[0], value: '' };
  });
}

function renderProducts(){
  const box = document.getElementById('productsList');
  let list = products.slice();
  if(prodQuery){
    const q = prodQuery.toLowerCase();
    list = list.filter(p=>
      p.name.toLowerCase().includes(q) ||
      p.brand.toLowerCase().includes(q)
    );
  }
  if(prodSort === 'asc') list.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));
  if(prodSort === 'desc') list.sort((a,b)=>(b.price??-Infinity)-(a.price??-Infinity));

  if(!list.length){
    box.innerHTML = `<div class="empty">${prodQuery ? 'Ничего не найдено.' : 'Товаров пока нет.' + (isAdmin ? ' Нажмите «+ Товар».' : '')}</div>`;
    return;
  }

  box.innerHTML = list.map(p=>{
    const matcher = buildTermMatcher(p.brand, p.categoryId || currentCat?.id);
    const groups = {};
    (p.specs||[]).forEach(s=>{
      if(!groups[s.group]) groups[s.group] = [];
      groups[s.group].push(s);
    });
    return `
      <div class="product-card" data-pid="${esc(p.id)}">
        ${p.imageUrl ? `<img class="img" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="placeholder">📦</div>`}
        <div class="body">
          <h3>${esc(p.name)}</h3>
          ${p.brand ? `<div class="brand">${esc(p.brand)}</div>` : ''}
          ${p.price!=null ? `<div class="price">${p.price.toLocaleString('ru-RU')} ₽</div>` : `<div class="price">Цена по запросу</div>`}
          ${p.shortDesc ? `<div class="short">${linkifyText(p.shortDesc, matcher)}</div>` : ''}
        </div>
        <div class="details">
          ${Object.keys(groups).map(g=>`
            <div class="spec-group">
              <h4>${esc(g)}</h4>
              ${groups[g].map(s=>`<div class="spec-row"><span>${linkifyText(s.key, matcher)}</span><span>${linkifyText(s.value, matcher)}</span></div>`).join('')}
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

let glossaryQuery = '';

let glossaryBrandFilter = 'all';

async function loadGlossary(){
  try{
    const snapshot = await getDocs(collection(db, 'glossary'));
    glossary = [];
    snapshot.forEach(d=>{
      const x = d.data();
      glossary.push({
        id: d.id,
        title: x.title || '',
        aliases: x.aliases || '',
        categoryId: x.categoryId || '',
        brand: x.brand || '',
        shortDesc: x.shortDesc || '',
        details: x.details || ''
      });
    });
    glossary.sort((a,b)=>a.title.localeCompare(b.title, 'ru'));
    updateBrandsDatalist();
    populateGlossaryBrandFilter();
    renderGlossary();
    if(currentCat) renderProducts();
  }catch(e){
    console.error(e);
    toast('Ошибка загрузки справочника');
  }
}

function populateGlossaryBrandFilter(){
  const sel = document.getElementById('glossaryBrandFilter');
  const prev = sel.value || 'all';
  const brands = [...new Set(glossary.map(g=>g.brand.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b, 'ru'));
  sel.innerHTML = `<option value="all">Все бренды</option><option value="">Общие (без бренда)</option>` +
    brands.map(b=>`<option value="${esc(b.toLowerCase())}">${esc(b)}</option>`).join('');
  sel.value = [...sel.options].some(o=>o.value===prev) ? prev : 'all';
  glossaryBrandFilter = sel.value;
}

function renderGlossary(){
  const box = document.getElementById('glossaryList');
  let list = glossary.slice();

  if(glossaryCatFilter !== 'all'){
    list = list.filter(g=>(g.categoryId || '') === glossaryCatFilter);
  }
  if(glossaryBrandFilter !== 'all'){
    list = list.filter(g=>(g.brand || '').trim().toLowerCase() === glossaryBrandFilter);
  }
  if(glossaryQuery){
    const q = glossaryQuery.toLowerCase();
    list = list.filter(g=>
      g.title.toLowerCase().includes(q) ||
      g.aliases.toLowerCase().includes(q) ||
      g.brand.toLowerCase().includes(q) ||
      g.shortDesc.toLowerCase().includes(q) ||
      g.details.toLowerCase().includes(q)
    );
  }

  if(!list.length){
    box.innerHTML = `<div class="empty">${glossaryQuery || glossaryCatFilter!=='all' || glossaryBrandFilter!=='all' ? 'Ничего не найдено.' : 'В справочнике пока пусто.' + (isAdmin ? ' Нажмите «+ Термин» или «📥 Импорт».' : '')}</div>`;
    return;
  }

  box.innerHTML = list.map(g=>`
    <div class="glossary-card" data-gid="${esc(g.id)}">
      <div class="badges-row">
        <span class="badge brand-badge">${g.brand ? esc(g.brand) : 'Общий'}</span>
        <span class="badge">${esc(getCatLabel(g.categoryId))}</span>
      </div>
      <div class="g-head">
        <h3>${esc(g.title)}</h3>
      </div>
      ${g.aliases ? `<div class="aliases">Также: ${esc(g.aliases)}</div>` : ''}
      ${g.shortDesc ? `<div class="short">${esc(g.shortDesc)}</div>` : ''}
      ${(g.details || isAdmin) ? `
        <div class="g-details">
          ${g.details ? `<div>${esc(g.details)}</div>` : '<div style="color:var(--muted)">Нет дополнительного описания</div>'}
          ${isAdmin ? `
            <div class="card-actions">
              <button class="btn secondary small" data-gedit="${esc(g.id)}">✏️ Изменить</button>
              <button class="btn danger small" data-gdel="${esc(g.id)}">🗑️ Удалить</button>
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>
  `).join('');
}

document.getElementById('importRun').onclick = async ()=>{
  if(!isAdmin){ toast('Только администратор'); return; }
  const raw = document.getElementById('importJson').value.trim();
  if(!raw){ toast('Вставьте JSON или выберите файл'); return; }

  let arr;
  try{
    const clean = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
    const parsed = JSON.parse(clean);
    arr = Array.isArray(parsed) ? parsed : (parsed?.terms || parsed?.glossary || parsed?.items);
    if(!Array.isArray(arr)) throw new Error();
  }catch{
    toast('Ошибка в формате JSON');
    return;
  }

  const defaultCatId = document.getElementById('importDefaultCat').value;
  const defaultBrand = document.getElementById('importDefaultBrand').value.trim();
  const updateExisting = document.getElementById('importUpdateExisting').checked;

  const catIds = new Set(categories.map(c=>c.id));
  const catByName = new Map(categories.map(c=>[c.name.trim().toLowerCase(), c.id]));

  const existingById = new Map(glossary.map(g=>[g.id, g]));
  const existingByKey = new Map(glossary.map(g=>[
    `${g.title.trim().toLowerCase()}|${g.brand.trim().toLowerCase()}|${g.categoryId || ''}`,
    g.id
  ]));

  const ops = [];
  let added = 0;
  let updated = 0;
  let skipped = 0;

  arr.forEach((item, idx)=>{
    if(!item || typeof item !== 'object'){ skipped++; return; }
    const title = String(item.title ?? item.name ?? '').trim();
    if(!title){ skipped++; return; }

    const rawAliases = item.aliases ?? item.synonyms ?? '';
    const aliases = Array.isArray(rawAliases)
      ? rawAliases.map(x=>String(x).trim()).filter(Boolean).join(', ')
      : String(rawAliases).trim();

    let categoryId = defaultCatId;
    if(item.categoryId && catIds.has(String(item.categoryId))){
      categoryId = String(item.categoryId);
    }else if(item.category || item.categoryName){
      const catKey = String(item.category ?? item.categoryName).trim().toLowerCase();
      if(catByName.has(catKey)) categoryId = catByName.get(catKey);
    }

    const brand = item.brand !== undefined ? String(item.brand).trim() || defaultBrand : defaultBrand;
    const shortDesc = String(item.shortDesc ?? item.short ?? item.description ?? '').trim();
    const details = String(item.details ?? item.detail ?? '').trim();

    const data = { title, aliases, categoryId, brand, shortDesc, details };
    const uniqKey = `${title.toLowerCase()}|${brand.toLowerCase()}|${categoryId}`;

    let docId = null;
    if(updateExisting){
      if(item.id && existingById.has(String(item.id))){
        docId = String(item.id);
      }else if(existingByKey.has(uniqKey)){
        docId = existingByKey.get(uniqKey);
      }
    }

    if(docId){
      updated++;
    }else{
      docId = 'g' + Date.now().toString(36) + idx.toString(36) + Math.random().toString(36).slice(2,5);
      added++;
      if(updateExisting) existingByKey.set(uniqKey, docId);
    }

    ops.push({ id: docId, data });
  });

  if(!ops.length){
    toast('Нет подходящих терминов для импорта');
    return;
  }

  try{
    for(let i = 0; i < ops.length; i += 400){
      const batch = writeBatch(db);
      ops.slice(i, i + 400).forEach(op=>{
        batch.set(doc(db, 'glossary', op.id), op.data);
      });
      await batch.commit();
    }
    document.getElementById('importDlg').classList.remove('show');
    toast(`Готово: +${added}, обновлено ${updated}${skipped ? `, пропущено ${skipped}` : ''}`);
    await loadGlossary();
  }catch(e){
    console.error(e);
    toast('Ошибка записи в базу');
  }
};

// --- Экспорт JSON ---
function buildExportJson(){
  const catNameById = new Map(categories.map(c=>[c.id, c.name]));
  const data = glossary.map(g=>({
    id: g.id,
    title: g.title,
    aliases: g.aliases,
    category: catNameById.get(g.categoryId) || '',
    categoryId: g.categoryId || '',
    brand: g.brand,
    shortDesc: g.shortDesc,
    details: g.details
  }));
  return JSON.stringify(data, null, 2);
}

document.getElementById('exportGlossaryBtn').onclick = ()=>{
  document.getElementById('exportCount').textContent = glossary.length;
  document.getElementById('exportJson').value = buildExportJson();
  document.getElementById('exportDlg').classList.add('show');
};
document.getElementById('exportClose').onclick = ()=>document.getElementById('exportDlg').classList.remove('show');
document.getElementById('exportCopy').onclick = async ()=>{
  const area = document.getElementById('exportJson');
  const ok = await copyText(area.value, 'JSON скопирован');
  if(!ok){
    area.select();
    document.execCommand('copy');
    toast('JSON скопирован');
  }
};
document.getElementById('exportDownload').onclick = ()=>{
  const json = document.getElementById('exportJson').value;
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `glossary-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Файл скачан');
};

document.getElementById('catsGrid').addEventListener('click', e=>{

  if(!cat) return;
  currentCat = cat;
  prodQuery = '';
  prodSort = null;
  document.getElementById('prodSearch').value = '';
  updateSortButtons();
  document.getElementById('catTitle').textContent = cat.emoji+' '+cat.name;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('categoryView').style.display = 'block';
  document.getElementById('glossaryView').style.display = 'none';
  loadProducts(cat.id);
});

document.getElementById('backBtn').onclick = ()=>{
  currentCat = null;
  document.getElementById('categoryView').style.display = 'none';
  document.getElementById('homeView').style.display = 'block';
};

document.getElementById('mainTabs').addEventListener('click', e=>{
  const tab = e.target.closest('.tab'); if(!tab) return;
  const name = tab.dataset.tab;
  currentCat = null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===tab));
  document.getElementById('homeView').style.display = name==='home' ? 'block' : 'none';
  document.getElementById('categoryView').style.display = 'none';
  document.getElementById('glossaryView').style.display = name==='glossary' ? 'block' : 'none';
});

  document.getElementById('catDlg').classList.add('show');
};

document.getElementById('loginBtn').onclick = ()=>document.getElementById('loginDlg').classList.add('show');
document.getElementById('loginCancel').onclick = ()=>document.getElementById('loginDlg').classList.remove('show');
document.getElementById('loginSubmit').onclick = async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ toast('Введите email и пароль'); return; }
  try{
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    document.getElementById('loginDlg').classList.remove('show');
    toast(cred.user.uid === ADMIN_UID ? 'Вы вошли как администратор' : 'Нет прав администратора');
  }catch(e){ toast('Неверный email или пароль'); }
};
document.getElementById('logoutBtn').onclick = async ()=>{ await signOut(auth); toast('Вы вышли'); };

onAuthStateChanged(auth, (user)=>{
  isAdmin = !!(user && user.uid === ADMIN_UID);
  document.getElementById('addCatBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('addProductBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('addGlossaryBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('importGlossaryBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('exportGlossaryBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('loginBtn').style.display = user ? 'none' : '';
  document.getElementById('logoutBtn').style.display = user ? '' : 'none';
  renderCats();
  renderGlossary();
  if(currentCat) renderProducts();
});

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('sellerTheme', t);
  document.getElementById('themeBtn').textContent = t==='dark' ? '☀️' : '🌙';
}

};
