<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<title>Помощник продавца</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --text:#1c2333; --muted:#6b7486;
  --accent:#4f6df5; --accent-soft:#e8edff; --border:#e3e7f0; --shadow:0 2px 10px rgba(28,35,51,.08);
  --good:#16a34a; --good-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2;
  --radius:16px; --gap:12px; --pad:12px; --maxw:760px;
}
[data-theme="dark"]{
  --bg:#070b14; --card:#0f1626; --text:#dfe7f5; --muted:#8b99b5;
  --accent:#5b8cff; --accent-soft:#16233f; --border:#1e2b47; --shadow:0 2px 12px rgba(0,0,0,.5);
  --good:#4ade80; --good-bg:#052e16; --bad:#f87171; --bad-bg:#450a0a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;min-height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) 90px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:none;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.secondary.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border:1px solid transparent}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.icon-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs{display:flex;gap:8px;margin:10px 0 0;width:100%}
.tab{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

#catsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
@media (min-width:600px){#catsGrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){#catsGrid{grid-template-columns:repeat(4,1fr)}}
.cat-tile{position:relative;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px 12px;text-align:center;cursor:pointer;border:1px solid var(--border);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .1s}
.cat-tile:active{transform:scale(.97)}
.cat-tile .emoji{font-size:44px;line-height:1}
.cat-tile .name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.cat-del{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--bad);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

#categoryView,#glossaryView{display:none}
.back-btn{background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:6px}
.cat-title{font-size:20px;font-weight:700;margin:4px 0 10px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}

.filters-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.search-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:var(--bg);color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent)}
.brand-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.brand-chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.price-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price-range{display:flex;align-items:center;gap:6px;flex:1;min-width:200px}
.price-range input{width:100%;min-width:70px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);outline:none}
.price-range span{font-size:13px;color:var(--muted);white-space:nowrap}

.product-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;border:1px solid var(--border)}
.card-main{display:flex;gap:12px;padding:12px;cursor:pointer;align-items:flex-start}
.card-thumb{width:104px;height:104px;aspect-ratio:1/1;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--accent-soft);border:1px solid var(--border)}
.card-placeholder{width:104px;height:104px;aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--accent-soft);flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-brand{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.3px}
.card-info h3{font-size:16px;font-weight:700;margin:2px 0 4px;line-height:1.3}
.card-price{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px}
.card-short{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card.open .card-short{-webkit-line-clamp:unset}
.card-toggle-hint{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px;display:inline-block}

.product-card .details{display:none;padding:0 12px 14px;border-top:1px solid var(--border)}
.product-card.open .details{display:block}
.detail-tabs{display:flex;gap:6px;margin:10px 0}
.d-tab{flex:1;padding:7px 8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.d-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.d-pane{display:none}
.d-pane.active{display:block}

.spec-group{margin-top:10px}
.spec-group h4{font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.spec-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px}
.spec-row:last-child{border-bottom:none}
.spec-row span:last-child{font-weight:600;text-align:right}

.features-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.features-list li{font-size:14px;padding:8px 10px;background:var(--bg);border-radius:10px;border-left:3px solid var(--accent)}

.pros-cons{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
@media (min-width:520px){.pros-cons{grid-template-columns:1fr 1fr}}
.pc-box{padding:10px;border-radius:12px;font-size:13.5px}
.pc-box.pros{background:var(--good-bg);color:var(--good)}
.pc-box.cons{background:var(--bad-bg);color:var(--bad)}
.pc-box h5{font-size:13px;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.pc-box ul{padding-left:16px;display:flex;flex-direction:column;gap:4px}
.pc-box li{color:var(--text)}

.admin-card-actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

.dlg{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,20,35,.55)}
.dlg.show{display:flex}
.dlg-box{background:var(--card);border-radius:16px;padding:18px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3);max-height:90dvh;overflow-y:auto}
.dlg-box h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;outline:none;background:var(--bg);color:var(--text)}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.dlg-actions{display:flex;gap:10px;margin-top:14px}
.dlg-actions .btn{flex:1}

#toasts{position:fixed;left:0;right:0;bottom:20px;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateY(0)}
/* Справочник: горизонтальные кнопки разделов и брендов */
.g-sections{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.g-sections::-webkit-scrollbar{display:none}
.g-sec-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:transform .1s}
.g-sec-btn:active{transform:scale(.97)}
.g-sec-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.g-sec-btn .ico{font-size:19px;line-height:1}

.g-brands{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.g-brand-btn{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer}
.g-brand-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.g-brand-btn.all-btn{border-style:dashed}

.term-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer}
.term-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.term-title{font-size:16px;font-weight:700;color:var(--text)}
.term-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.term-tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.term-short{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45}
.term-details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:14px;color:var(--text);line-height:1.5;white-space:pre-line}
.term-card.open .term-details{display:block}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Помощник продавца</h1>
      <button class="icon-btn" id="themeBtn" title="Сменить тему">🌙</button>
      <button class="btn secondary small" id="loginBtn">Войти</button>
      <button class="btn secondary small" id="logoutBtn" style="display:none">Выйти</button>
    </div>
    <div class="tabs" id="mainTabs">
      <button class="tab active" data-tab="home">Главная</button>
      <button class="tab" data-tab="glossary">Справочник</button>
    </div>
  </header>

  <div id="homeView">
    <div class="view-actions">
      <button class="btn small" id="addCatBtn" style="display:none">+ Категория</button>
    </div>
    <div id="catsGrid"></div>
  </div>

  <div id="categoryView">
    <button class="back-btn" id="backBtn">← Назад к категориям</button>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <div class="cat-title" id="catTitle"></div>
      <button class="btn small" id="addProductBtn" style="display:none">+ Товар</button>
    </div>

    <div class="filters-panel">
      <input type="search" class="search-input" id="prodSearch" placeholder="Поиск по названию или описанию..." autocomplete="off">
      <div class="brand-chips" id="brandFilters"></div>
      <div class="price-controls">
        <button class="btn secondary small" id="sortPriceAsc">Цена ↑</button>
        <button class="btn secondary small" id="sortPriceDesc">Цена ↓</button>
        <div class="price-range">
          <span>Цена (тыс.):</span>
          <input type="number" id="priceMin" placeholder="От" min="0" step="1">
          <span>—</span>
          <input type="number" id="priceMax" placeholder="До" min="0" step="1">
        </div>
      </div>
    </div>

    <div id="productsList" style="margin-top:12px"></div>
  </div>

    <div id="glossaryView">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap">
      <div class="cat-title" style="margin:0">Справочник</div>
      <div style="display:flex;gap:6px">
        <button class="btn secondary small" id="addGSecBtn" style="display:none">+ Раздел</button>
        <button class="btn small" id="addTermBtn" style="display:none">+ Термин</button>
      </div>
    </div>

    <!-- Горизонтальные кнопки видов техники (Телевизоры, Телефоны, Колонки...) -->
    <div class="g-sections" id="gSectionsList"></div>

    <!-- Кнопки брендов выбранного раздела + «Все термины» -->
    <div id="gSubPanel" style="display:none">
      <div class="g-brands" id="gBrandsList"></div>

      <div class="filters-panel" style="margin-top:10px">
        <input type="search" class="search-input" id="termSearch" placeholder="Поиск по терминам и особенностям..." autocomplete="off">
      </div>
    </div>

    <div id="termsList" style="margin-top:12px"></div>
  </div>

</div>

<div class="dlg" id="catDlg">
  <div class="dlg-box">
    <h3>Новая категория</h3>
    <div class="field">
      <label>Название</label>
      <input type="text" id="catName" placeholder="Телевизоры">
    </div>
    <div class="field">
      <label>Эмодзи</label>
      <input type="text" id="catEmoji" placeholder="📺" maxlength="4">
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="catCancel">Отмена</button>
      <button class="btn" id="catSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="dlg" id="loginDlg">
  <div class="dlg-box">
    <h3>Вход для администратора</h3>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="loginCancel">Отмена</button>
      <button class="btn" id="loginSubmit">Войти</button>
    </div>
  </div>
</div>

<div class="dlg" id="prodDlg">
  <div class="dlg-box">
    <h3 id="prodDlgTitle">Новый товар</h3>
    <div class="field">
      <label>Прямая ссылка на квадратное фото (ImgBB)</label>
      <input type="text" id="pImage" placeholder="https://ibb.co...">
    </div>
    <div class="field">
      <label>Название модели</label>
      <input type="text" id="pName" placeholder="Samsung QLED Q60D 55&quot;">
    </div>
    <div class="field">
      <label>Бренд</label>
      <input type="text" id="pBrand" placeholder="Samsung">
    </div>
    <div class="field">
      <label>Цена в рублях (необязательно)</label>
      <input type="number" id="pPrice" placeholder="49990">
    </div>
    <div class="field">
      <label>Краткое описание</label>
      <textarea id="pShort" rows="2" placeholder="4K QLED, 55&quot;, Tizen OS"></textarea>
    </div>
    <div class="field">
      <label>Характеристики (Группа | Ключ | Значение)</label>
      <textarea id="pSpecs" rows="4" placeholder="Экран | Диагональ | 55&quot;&#10;Экран | Тип матрицы | QLED"></textarea>
    </div>
    <div class="field">
      <label>Особенности и фишки (каждая с новой строки)</label>
      <textarea id="pFeatures" rows="3" placeholder="Технология Quantum Dot&#10;Пульт SolarCell без батареек"></textarea>
    </div>
    <div class="field">
      <label>Плюсы (каждый с новой строки)</label>
      <textarea id="pPros" rows="2" placeholder="Яркая картинка&#10;Удобный Smart TV"></textarea>
    </div>
    <div class="field">
      <label>Минусы (каждый с новой строки)</label>
      <textarea id="pCons" rows="2" placeholder="Частота обновления 60 Гц"></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="prodCancel">Отмена</button>
      <button class="btn" id="prodSave">Сохранить</button>
    </div>
  </div>
</div>



<!-- Диалог раздела справочника -->
<div class="dlg" id="gSecDlg">
  <div class="dlg-box">
    <h3>Новый раздел справочника</h3>
    <div class="field">
      <label>Название раздела</label>
      <input type="text" id="gsName" placeholder="Телевизоры">
    </div>
    <div class="field">
      <label>Маленький символ (эмодзи)</label>
      <input type="text" id="gsIcon" placeholder="📺" maxlength="4">
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="gsCancel">Отмена</button>
      <button class="btn" id="gsSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Диалог термина / особенности -->
<div class="dlg" id="termDlg">
  <div class="dlg-box">
    <h3 id="termDlgTitle">Новый термин</h3>
    <div class="field">
      <label>Раздел техники</label>
      <select id="tSection" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--bg);color:var(--text)"></select>
    </div>
    <div class="field">
      <label>Бренд (или оставьте пустым для общих)</label>
      <input type="text" id="tBrand" placeholder="Samsung, LG, Sony...">
    </div>
    <div class="field">
      <label>Название термина / технологии</label>
      <input type="text" id="tTitle" placeholder="Q-Symphony или OLED">
    </div>
    <div class="field">
      <label>Кратко (суть для покупателя)</label>
      <textarea id="tShort" rows="2" placeholder="Синхронная работа динамиков телевизора и саундбара без отключения звука ТВ."></textarea>
    </div>
    <div class="field">
      <label>Подробности и особенности (необязательно)</label>
      <textarea id="tDetails" rows="4" placeholder="Работает по HDMI eARC или Wi-Fi на моделях от Q60 и выше..."></textarea>
    </div>
    <div class="dlg-actions">
      <button class="btn secondary" id="termCancel">Отмена</button>
      <button class="btn" id="termSave">Сохранить</button>
    </div>
  </div>
</div>

function toast(msg, isErr){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isErr) el.style.background = '#dc2626';
  el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 2800);
}
function genId(prefix='c'){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function parseLines(text){ return text.split('\n').map(l=>l.trim()).filter(Boolean); }

function parseSpecs(text){
  return parseLines(text).map(line=>{
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length >= 3) return { group: parts[0], key: parts[1], value: parts.slice(2).join(' ') };
    if(parts.length === 2) return { group: 'Общее', key: parts[0], value: parts[1] };
    return { group: 'Общее', key: parts[0], value: '' };
  });
}

async function loadProducts(catId){
  const box = document.getElementById('productsList');
  box.innerHTML = `<div class="empty">Загрузка товаров...</div>`;
  products = []; // Обязательно очищаем список перед загрузкой новой категории
  try{
    const q = query(collection(db, 'products'), where('categoryId', '==', catId));
    const snapshot = await getDocs(q);
    snapshot.forEach(d=>{
      const x = d.data();
      // Жесткая проверка: берем товар ТОЛЬКО если его categoryId совпадает с открытой категорией
      if(x.categoryId === catId){
        products.push({
          id: d.id,
          categoryId: x.categoryId,
          name: x.name||'',
          brand: x.brand||'',
          price: x.price ?? null,
          imageUrl: x.imageUrl||'',
          shortDesc: x.shortDesc||'',
          specs: Array.isArray(x.specs) ? x.specs : [],
          features: Array.isArray(x.features) ? x.features : [],
          pros: Array.isArray(x.pros) ? x.pros : [],
          cons: Array.isArray(x.cons) ? x.cons : []
        });
      }
    });
    renderBrandFilters();
    renderProducts();
  }catch(e){
    console.error(e);
    box.innerHTML = `<div class="empty">Ошибка загрузки: ${esc(e.code || e.message)}</div>`;
    toast('Ошибка загрузки товаров', true);
  }
}


function specsToText(specs){
  return (specs||[]).map(s=>`${s.group} | ${s.key} | ${s.value}`).join('\n');
}


function renderBrandFilters(){
  const container = document.getElementById('brandFilters');
  const brands = [...new Set(products.map(p=>p.brand.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(!brands.length){ container.innerHTML = ''; return; }
  container.innerHTML = [
    `<button class="chip ${selectedBrand===''?'active':''}" data-brand="">Все бренды</button>`,
    ...brands.map(b=>`<button class="chip ${selectedBrand===b?'active':''}" data-brand="${esc(b)}">${esc(b)}</button>`)
  ].join('');
}

document.getElementById('brandFilters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  selectedBrand = chip.dataset.brand;
  renderBrandFilters();
  renderProducts();
});

function updateSortButtons(){
  document.getElementById('sortPriceAsc').classList.toggle('active', prodSort === 'asc');
  document.getElementById('sortPriceDesc').classList.toggle('active', prodSort === 'desc');
}
function renderProducts(){
  const box = document.getElementById('productsList');
  let list = products.slice();

  if(prodQuery){
    const q = prodQuery.toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q) || p.shortDesc.toLowerCase().includes(q));
  }
  if(selectedBrand) list = list.filter(p=>p.brand.trim() === selectedBrand);
  if(priceMinK !== null && !isNaN(priceMinK)) list = list.filter(p=>p.price !== null && p.price >= priceMinK * 1000);
  if(priceMaxK !== null && !isNaN(priceMaxK)) list = list.filter(p=>p.price !== null && p.price <= priceMaxK * 1000);
  if(prodSort === 'asc') list.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));
  if(prodSort === 'desc') list.sort((a,b)=>(b.price??-Infinity)-(a.price??-Infinity));

  if(!list.length){
    const hasFilters = prodQuery || selectedBrand || priceMinK !== null || priceMaxK !== null;
    box.innerHTML = `<div class="empty">${hasFilters ? 'По заданным фильтрам ничего не найдено.' : 'В этой категории пока нет товаров.'}${isAdmin && !hasFilters ? ' Нажмите «+ Товар».' : ''}</div>`;
    return;
  }

  box.innerHTML = list.map(p=>{
    const groups = {};
    (p.specs||[]).forEach(s=>{
      if(!groups[s.group]) groups[s.group] = [];
      groups[s.group].push(s);
    });
    const hasSpecs = Object.keys(groups).length > 0;
    const hasFeatures = p.features && p.features.length > 0;
    const hasProsCons = (p.pros && p.pros.length > 0) || (p.cons && p.cons.length > 0);

    return `
      <div class="product-card" data-pid="${esc(p.id)}">
        <div class="card-main">
          ${p.imageUrl ? `<img class="card-thumb" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="card-placeholder">📦</div>`}
          <div class="card-info">
            ${p.brand ? `<div class="card-brand">${esc(p.brand)}</div>` : ''}
            <h3>${esc(p.name)}</h3>
            <div class="card-price">${p.price!=null ? Number(p.price).toLocaleString('ru-RU') + ' ₽' : 'Цена по запросу'}</div>
            ${p.shortDesc ? `<div class="card-short">${esc(p.shortDesc)}</div>` : ''}
            <span class="card-toggle-hint">Подробнее ▾</span>
          </div>
        </div>
        <div class="details">
          <div class="detail-tabs">
            <button class="d-tab active" data-pane="specs">Характеристики</button>
            <button class="d-tab" data-pane="features">Особенности</button>
            <button class="d-tab" data-pane="proscons">Плюсы и минусы</button>
          </div>
          <div class="d-pane active" data-pane-box="specs">
            ${hasSpecs ? Object.keys(groups).map(g=>`
              <div class="spec-group">
                <h4>${esc(g)}</h4>
                ${groups[g].map(s=>`<div class="spec-row"><span>${esc(s.key)}</span><span>${esc(s.value)}</span></div>`).join('')}
              </div>`).join('') : '<div style="font-size:13px;color:var(--muted);padding:6px 0">Характеристики не указаны</div>'}
          </div>
          <div class="d-pane" data-pane-box="features">
            ${hasFeatures ? `<ul class="features-list">${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`
              : '<div style="font-size:13px;color:var(--muted);padding:6px 0">Особенности не добавлены</div>'}
          </div>
          <div class="d-pane" data-pane-box="proscons">
            ${hasProsCons ? `
              <div class="pros-cons">
                <div class="pc-box pros">
                  <h5>Плюсы</h5>
                  ${p.pros.length ? `<ul>${p.pros.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>` : '<div>Не указаны</div>'}
                </div>
                <div class="pc-box cons">
                  <h5>Минусы</h5>
                  ${p.cons.length ? `<ul>${p.cons.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>` : '<div>Не указаны</div>'}
                </div>
              </div>` : '<div style="font-size:13px;color:var(--muted);padding:6px 0">Плюсы и минусы не указаны</div>'}
          </div>
          ${isAdmin ? `
            <div class="admin-card-actions">
              <button class="btn secondary small edit-prod-btn" data-pid="${esc(p.id)}">✏️ Изменить</button>
              <button class="btn danger small del-prod-btn" data-pid="${esc(p.id)}">🗑 Удалить</button>
            </div>` : ''}
        </div>
      </div>`;
  }).join('');
}

document.getElementById('productsList').addEventListener('click', async e=>{
  const dTab = e.target.closest('.d-tab');
  if(dTab){
    const card = dTab.closest('.product-card');
    const targetPane = dTab.dataset.pane;
    card.querySelectorAll('.d-tab').forEach(t=>t.classList.toggle('active', t===dTab));
    card.querySelectorAll('.d-pane').forEach(p=>p.classList.toggle('active', p.dataset.paneBox===targetPane));
    return;
  }

  const editBtn = e.target.closest('.edit-prod-btn');
  if(editBtn && isAdmin){
    const p = products.find(item=>item.id===editBtn.dataset.pid);
    if(!p) return;
    editingProductId = p.id;
    document.getElementById('prodDlgTitle').textContent = 'Редактировать товар';
    document.getElementById('pImage').value = p.imageUrl || '';
    document.getElementById('pName').value = p.name || '';
    document.getElementById('pBrand').value = p.brand || '';
    document.getElementById('pPrice').value = p.price ?? '';
    document.getElementById('pShort').value = p.shortDesc || '';
    document.getElementById('pSpecs').value = specsToText(p.specs);
    document.getElementById('pFeatures').value = (p.features||[]).join('\n');
    document.getElementById('pPros').value = (p.pros||[]).join('\n');
    document.getElementById('pCons').value = (p.cons||[]).join('\n');
    document.getElementById('prodDlg').classList.add('show');
    return;
  }

  const delBtn = e.target.closest('.del-prod-btn');
  if(delBtn && isAdmin){
    if(!confirm('Удалить этот товар?')) return;
    try{
      await deleteDoc(doc(db, 'products', delBtn.dataset.pid));
      toast('Товар удален');
      await loadProducts(currentCat.id);
    }catch(err){ toast('Ошибка удаления', true); }
    return;
  }

  const mainArea = e.target.closest('.card-main');
  if(mainArea){
    const card = mainArea.closest('.product-card');
    const isOpen = card.classList.toggle('open');
    const hint = card.querySelector('.card-toggle-hint');
    if(hint) hint.textContent = isOpen ? 'Свернуть ▴' : 'Подробнее ▾';
  }
});

  clearTimeout(prodTimer);
  prodTimer = setTimeout(()=>{ prodQuery = v; renderProducts(); }, 150);
});

  const v = e.target.value.trim();
  priceMinK = v === '' ? null : Number(v);
  renderProducts();
});
document.getElementById('priceMax').addEventListener('input', e=>{
  const v = e.target.value.trim();
  priceMaxK = v === '' ? null : Number(v);
  renderProducts();
});

};
document.getElementById('sortPriceDesc').onclick = ()=>{

};

document.getElementById('addProductBtn').onclick = ()=>{
  editingProductId = null;
  document.getElementById('prodDlgTitle').textContent = 'Новый товар';
  ['pImage','pName','pBrand','pPrice','pShort','pSpecs','pFeatures','pPros','pCons'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('prodDlg').classList.add('show');
};
document.getElementById('prodCancel').onclick = ()=>document.getElementById('prodDlg').classList.remove('show');

document.getElementById('prodSave').onclick = async ()=>{
  if(!isAdmin){ toast('Только администратор', true); return; }
  if(!currentCat){ toast('Сначала выберите категорию', true); return; }
  const name = document.getElementById('pName').value.trim();
  if(!name){ toast('Введите название', true); return; }
  const priceRaw = document.getElementById('pPrice').value.trim();

  const data = {
    categoryId: currentCat.id,
    name,
    brand: document.getElementById('pBrand').value.trim(),
    price: priceRaw === '' ? null : Number(priceRaw),
    imageUrl: document.getElementById('pImage').value.trim(),
    shortDesc: document.getElementById('pShort').value.trim(),
    specs: parseSpecs(document.getElementById('pSpecs').value),
    features: parseLines(document.getElementById('pFeatures').value),
    pros: parseLines(document.getElementById('pPros').value),
    cons: parseLines(document.getElementById('pCons').value)
  };

  try{
    const id = editingProductId || genId('p');
    await setDoc(doc(db, 'products', id), data);
    document.getElementById('prodDlg').classList.remove('show');
    toast(editingProductId ? 'Товар обновлен' : 'Товар добавлен');
    await loadProducts(currentCat.id);
  }catch(e){
    console.error(e);
    toast('Ошибка сохранения: ' + (e.code || e.message), true);
  }
};

async function loadCategories(){
  try{
    const snapshot = await getDocs(collection(db, 'categories'));
    categories = [];
    snapshot.forEach(d=>{
      const x = d.data();
      categories.push({ id:d.id, name:x.name||'', emoji:x.emoji||'📦', order:x.order||0 });
    });
    categories.sort((a,b)=>(a.order||0)-(b.order||0));
    renderCats();
  }catch(e){
    console.error(e);
    toast('Ошибка загрузки категорий', true);
  }
}

async function saveCategory(data){
  if(!isAdmin){ toast('Только администратор', true); return; }
  try{
    const id = genId('c');
    await setDoc(doc(db, 'categories', id), { ...data, order: categories.length });
    await loadCategories();
    toast('Категория добавлена');
  }catch(e){
    console.error(e);
    toast('Ошибка сохранения: ' + (e.code || e.message), true);
  }
}

function renderCats(){
  const grid = document.getElementById('catsGrid');
  if(!categories.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Категорий пока нет.${isAdmin?' Нажмите «+ Категория».':''}</div>`;
    return;
  }
  grid.innerHTML = categories.map(c=>`
    <div class="cat-tile" data-cat="${esc(c.id)}">
      ${isAdmin ? `<button class="cat-del" data-del-cat="${esc(c.id)}" title="Удалить категорию">✕</button>` : ''}
      <div class="emoji">${esc(c.emoji)}</div>
      <div class="name">${esc(c.name)}</div>
    </div>`).join('');
}

document.getElementById('catsGrid').addEventListener('click', async e=>{
  const delBtn = e.target.closest('[data-del-cat]');
  if(delBtn && isAdmin){
    e.stopPropagation();
    if(!confirm('Удалить эту категорию?')) return;
    try{
      await deleteDoc(doc(db, 'categories', delBtn.dataset.delCat));
      toast('Категория удалена');
      await loadCategories();
    }catch(err){ toast('Ошибка удаления', true); }
    return;
  }

  const tile = e.target.closest('[data-cat]');
  if(!tile) return;
  const cat = categories.find(c=>c.id===tile.dataset.cat);
  if(!cat) return;

  currentCat = cat;
  prodQuery = '';
  selectedBrand = '';
  priceMinK = null;
  priceMaxK = null;
  prodSort = null;

  document.getElementById('prodSearch').value = '';
  document.getElementById('priceMin').value = '';
  document.getElementById('priceMax').value = '';
  updateSortButtons();

  document.getElementById('catTitle').textContent = cat.emoji + ' ' + cat.name;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('categoryView').style.display = 'block';
  document.getElementById('glossaryView').style.display = 'none';
  loadProducts(cat.id);
});

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('sellerTheme', t);
  document.getElementById('themeBtn').textContent = t==='dark' ? '☀️' : '🌙';
}

document.getElementById('themeBtn').onclick = ()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
};

let gSections = [];
let terms = [];
let activeGSection = '';
let activeGBrand = '__ALL__';
let termQuery = '';
let editingTermId = null;

async function loadGlossaryData(){
  try{
    const [secSnap, termSnap] = await Promise.all([
      getDocs(collection(db, 'glossary_sections')),
      getDocs(collection(db, 'glossary'))
    ]);
    gSections = [];
    secSnap.forEach(d=>{
      const x = d.data();
      gSections.push({ id: d.id, name: x.name || '', icon: x.icon || '📘', order: x.order || 0 });
    });
    gSections.sort((a,b)=>(a.order||0)-(b.order||0));

    terms = [];
    termSnap.forEach(d=>{
      const x = d.data();
      terms.push({
        id: d.id,
        sectionId: x.sectionId || '',
        brand: x.brand || '',
        title: x.title || '',
        short: x.short || '',
        details: x.details || ''
      });
    });
    terms.sort((a,b)=>a.title.localeCompare(b.title));

    renderGSections();
    renderGBrands();
    renderTerms();
  }catch(e){
    console.error(e);
    toast('Ошибка загрузки справочника', true);
  }
}

function renderGSections(){
  const box = document.getElementById('gSectionsList');
  if(!gSections.length){
    box.innerHTML = `<div class="empty" style="padding:20px;width:100%">Разделов пока нет.${isAdmin ? ' Нажмите «+ Раздел».' : ''}</div>`;
    document.getElementById('gSubPanel').style.display = 'none';
    document.getElementById('termsList').innerHTML = '';
    return;
  }
  box.innerHTML = gSections.map(s=>`
    <button class="g-sec-btn ${activeGSection===s.id?'active':''}" data-gsec="${esc(s.id)}">
      <span class="ico">${esc(s.icon)}</span>
      <span>${esc(s.name)}</span>
      ${isAdmin ? `<span data-del-gsec="${esc(s.id)}" style="margin-left:4px;opacity:.7;font-size:12px" title="Удалить раздел">✕</span>` : ''}
    </button>
  `).join('');
}

document.getElementById('gSectionsList').addEventListener('click', async e=>{
  const delBtn = e.target.closest('[data-del-gsec]');
  if(delBtn && isAdmin){
    e.stopPropagation();
    if(!confirm('Удалить этот раздел справочника?')) return;
    try{
      await deleteDoc(doc(db, 'glossary_sections', delBtn.dataset.delGsec));
      if(activeGSection === delBtn.dataset.delGsec) activeGSection = '';
      toast('Раздел удален');
      await loadGlossaryData();
    }catch(err){ toast('Ошибка удаления', true); }
    return;
  }

  const btn = e.target.closest('[data-gsec]');
  if(!btn) return;
  activeGSection = btn.dataset.gsec;
  activeGBrand = '__ALL__';
  termQuery = '';
  document.getElementById('termSearch').value = '';
  document.getElementById('gSubPanel').style.display = 'block';

  renderGSections();
  renderGBrands();
  renderTerms();
});

function renderGBrands(){
  const box = document.getElementById('gBrandsList');
  if(!activeGSection){ box.innerHTML = ''; return; }

  const sectionTerms = terms.filter(t=>t.sectionId === activeGSection);
  const brands = [...new Set(sectionTerms.map(t=>t.brand.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  box.innerHTML = [
    `<button class="g-brand-btn all-btn ${activeGBrand==='__ALL__'?'active':''}" data-gbrand="__ALL__">ВСЕ ТЕРМИНЫ (${sectionTerms.length})</button>`,
    ...brands.map(b=>`<button class="g-brand-btn ${activeGBrand===b?'active':''}" data-gbrand="${esc(b)}">${esc(b)}</button>`)
  ].join('');
}

document.getElementById('gBrandsList').addEventListener('click', e=>{
  const btn = e.target.closest('[data-gbrand]');
  if(!btn) return;
  activeGBrand = btn.dataset.gbrand;
  renderGBrands();
  renderTerms();
});

function renderTerms(){
  const box = document.getElementById('termsList');
  if(!activeGSection){
    if(gSections.length) box.innerHTML = `<div class="empty">Выберите раздел техники сверху (например, Телевизоры или Телефоны).</div>`;
    return;
  }

  let list = terms.filter(t=>t.sectionId === activeGSection);

  if(activeGBrand !== '__ALL__'){
    list = list.filter(t=>t.brand.trim() === activeGBrand);
  }
  if(termQuery){
    const q = termQuery.toLowerCase();
    list = list.filter(t=>
      t.title.toLowerCase().includes(q) ||
      t.short.toLowerCase().includes(q) ||
      t.details.toLowerCase().includes(q) ||
      t.brand.toLowerCase().includes(q)
    );
  }

  if(!list.length){
    box.innerHTML = `<div class="empty">${termQuery ? 'По запросу ничего не найдено.' : 'В этом разделе пока нет терминов.'}${isAdmin && !termQuery ? ' Нажмите «+ Термин».' : ''}</div>`;
    return;
  }

  box.innerHTML = list.map(t=>`
    <div class="term-card" data-tid="${esc(t.id)}">
      <div class="term-header">
        <div class="term-title">${esc(t.title)}</div>
        <div class="term-badges">
          ${t.brand ? `<span class="term-tag">${esc(t.brand)}</span>` : `<span class="term-tag">Общий</span>`}
        </div>
      </div>
      ${t.short ? `<div class="term-short">${esc(t.short)}</div>` : ''}
      ${(t.details || isAdmin) ? `
        <div class="term-details">
          ${t.details ? `<div>${esc(t.details)}</div>` : ''}
          ${isAdmin ? `
            <div class="admin-card-actions">
              <button class="btn secondary small edit-term-btn" data-tid="${esc(t.id)}">✏️ Изменить</button>
              <button class="btn danger small del-term-btn" data-tid="${esc(t.id)}">🗑 Удалить</button>
            </div>` : ''}
        </div>` : ''}
    </div>
  `).join('');
}

document.getElementById('termsList').addEventListener('click', async e=>{
  const editBtn = e.target.closest('.edit-term-btn');
  if(editBtn && isAdmin){
    e.stopPropagation();
    const t = terms.find(item=>item.id===editBtn.dataset.tid);
    if(!t) return;
    editingTermId = t.id;
    fillSectionSelect(t.sectionId);
    document.getElementById('termDlgTitle').textContent = 'Редактировать термин';
    document.getElementById('tBrand').value = t.brand;
    document.getElementById('tTitle').value = t.title;
    document.getElementById('tShort').value = t.short;
    document.getElementById('tDetails').value = t.details;
    document.getElementById('termDlg').classList.add('show');
    return;
  }

  const delBtn = e.target.closest('.del-term-btn');
  if(delBtn && isAdmin){
    e.stopPropagation();
    if(!confirm('Удалить этот термин?')) return;
    try{
      await deleteDoc(doc(db, 'glossary', delBtn.dataset.tid));
      toast('Термин удален');
      await loadGlossaryData();
    }catch(err){ toast('Ошибка удаления', true); }
    return;
  }

  const card = e.target.closest('.term-card');
  if(card) card.classList.toggle('open');
});

let termTimer = null;
document.getElementById('termSearch').addEventListener('input', e=>{
  const v = e.target.value.trim();
  clearTimeout(termTimer);
  termTimer = setTimeout(()=>{ termQuery = v; renderTerms(); }, 150);
});

document.getElementById('addGSecBtn').onclick = ()=>{
  document.getElementById('gsName').value = '';
  document.getElementById('gsIcon').value = '';
  document.getElementById('gSecDlg').classList.add('show');
};
document.getElementById('gsCancel').onclick = ()=>document.getElementById('gSecDlg').classList.remove('show');
document.getElementById('gsSave').onclick = async ()=>{
  if(!isAdmin){ toast('Только администратор', true); return; }
  const name = document.getElementById('gsName').value.trim();
  const icon = document.getElementById('gsIcon').value.trim() || '📘';
  if(!name){ toast('Введите название раздела', true); return; }
  try{
    const id = genId('gs');
    await setDoc(doc(db, 'glossary_sections', id), { name, icon, order: gSections.length });
    document.getElementById('gSecDlg').classList.remove('show');
    activeGSection = id;
    document.getElementById('gSubPanel').style.display = 'block';
    toast('Раздел добавлен');
    await loadGlossaryData();
  }catch(e){ toast('Ошибка: ' + (e.code || e.message), true); }
};

function fillSectionSelect(selectedId){
  const sel = document.getElementById('tSection');
  sel.innerHTML = gSections.map(s=>`<option value="${esc(s.id)}" ${s.id===selectedId?'selected':''}>${esc(s.icon)} ${esc(s.name)}</option>`).join('');
}

document.getElementById('addTermBtn').onclick = ()=>{
  if(!gSections.length){ toast('Сначала создайте раздел (+ Раздел)', true); return; }
  editingTermId = null;
  fillSectionSelect(activeGSection || gSections.at(0)?.id);
  document.getElementById('termDlgTitle').textContent = 'Новый термин';
  document.getElementById('tBrand').value = activeGBrand !== '__ALL__' ? activeGBrand : '';
  document.getElementById('tTitle').value = '';
  document.getElementById('tShort').value = '';
  document.getElementById('tDetails').value = '';
  document.getElementById('termDlg').classList.add('show');
};
document.getElementById('termCancel').onclick = ()=>document.getElementById('termDlg').classList.remove('show');

document.getElementById('termSave').onclick = async ()=>{
  if(!isAdmin){ toast('Только администратор', true); return; }
  const sectionId = document.getElementById('tSection').value;
  const title = document.getElementById('tTitle').value.trim();
  if(!sectionId){ toast('Выберите раздел', true); return; }
  if(!title){ toast('Введите название термина', true); return; }

  const data = {
    sectionId,
    brand: document.getElementById('tBrand').value.trim(),
    title,
    short: document.getElementById('tShort').value.trim(),
    details: document.getElementById('tDetails').value.trim()
  };

  try{
    const id = editingTermId || genId('t');
    await setDoc(doc(db, 'glossary', id), data);
    document.getElementById('termDlg').classList.remove('show');
    activeGSection = sectionId;
    document.getElementById('gSubPanel').style.display = 'block';
    toast(editingTermId ? 'Термин обновлен' : 'Термин добавлен');
    await loadGlossaryData();
  }catch(e){ toast('Ошибка: ' + (e.code || e.message), true); }
};


if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
loadCategories();
loadGlossaryData();

</script>
</body>
</html>
