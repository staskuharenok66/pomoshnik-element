<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6df5">
<title>Помощник продавца</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --text:#1c2333; --muted:#6b7486;
  --accent:#4f6df5; --accent-soft:#e8edff; --green:#1f9d61; --green-soft:#e3f6ec;
  --red:#d64545; --red-soft:#fdeaea; --border:#e3e7f0; --shadow:0 2px 10px rgba(28,35,51,.08);
  --feat-bg:#f7f9fd; --input-bg:#fbfcfe;
  --radius:16px; --gap:12px; --pad:12px; --maxw:760px; --header-pad-top:12px;
}
[data-theme="dark"]{
  --bg:#070b14; --card:#0f1626; --text:#dfe7f5; --muted:#8b99b5;
  --accent:#5b8cff; --accent-soft:#16233f; --green:#3ecf8e; --green-soft:#0f2a1e;
  --red:#ff6b6b; --red-soft:#30161a; --border:#1e2b47; --shadow:0 2px 12px rgba(0,0,0,.5);
  --feat-bg:#131d33; --input-bg:#0b1322;
}
[data-theme="dark"] body{background:#070b14}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;
  min-height:100dvh;
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
.wrap{
  max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:var(--header-pad-top) 0 8px;
  padding-top:calc(var(--header-pad-top) + env(safe-area-inset-top));
}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:none;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.icon-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.icon-btn svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sun{display:none}
[data-theme="dark"] .icon-btn .sun{display:block}
[data-theme="dark"] .icon-btn .moon{display:none}
.search{margin-top:10px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--border);border-radius:14px;font-size:16px;background:var(--card);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:var(--gap);overflow:hidden}
.card-head{padding:14px 16px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.card-head .info{flex:1;min-width:0}
.card h2{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px;margin-bottom:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.chev{width:22px;height:22px;stroke:var(--muted);flex:0 0 auto;margin-top:2px;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border)}
.card.open .card-body{display:block}
.block{margin-top:12px}
.block h3{font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}
.feat{background:var(--feat-bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.feat b{display:block;font-size:15px;overflow-wrap:anywhere}
.feat span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
ul.pluses,ul.minuses{list-style:none}
ul.pluses li,ul.minuses li{padding:8px 10px 8px 32px;border-radius:10px;font-size:14.5px;margin-bottom:6px;position:relative;overflow-wrap:anywhere}
ul.pluses li{background:var(--green-soft)}
ul.pluses li::before{content:"+";position:absolute;left:12px;font-weight:800;color:var(--green)}
ul.minuses li{background:var(--red-soft)}
ul.minuses li::before{content:"−";position:absolute;left:12px;font-weight:800;color:var(--red)}
.card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);z-index:50;display:none}
.overlay.show{display:block}
.modal{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-radius:20px 20px 0 0;max-width:var(--maxw);margin:0 auto;max-height:92dvh;overflow-y:auto;display:none;
  padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-overflow-scrolling:touch;
}
.modal.show{display:block}
.modal h2{font-size:18px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:16px;font-family:inherit;outline:none;background:var(--input-bg);color:var(--text)}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:80px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.modal-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.modal-actions .btn,.modal-actions .danger{flex:1;padding:13px;min-width:110px}
.danger{background:var(--red);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
.count{font-size:13px;color:var(--muted);padding:8px 4px 0}
#toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--red);color:#fff}
.dlg{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,20,35,.5)}
.dlg.show{display:flex}
.dlg-box{background:var(--card);border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3);max-height:90dvh;overflow-y:auto}
.dlg-box h3{font-size:17px;margin-bottom:8px}
.dlg-box p{font-size:15px;margin-bottom:16px}
.dlg-box p.muted{font-size:14px;color:var(--muted)}
.dlg-actions{display:flex;gap:10px}
.dlg-actions .btn,.dlg-actions .danger{flex:1}
.dlg-actions.col{flex-direction:column}

@media (min-width:820px){
  :root{--maxw:1100px;--gap:14px;--pad:20px;}
  h1{font-size:22px}
  #list{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start;}
  #list .card{margin-top:0}
}
@media (min-width:1280px){
  :root{--maxw:1360px;}
  #list{grid-template-columns:1fr 1fr 1fr}
}
@media (min-width:720px){
  .modal{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px, calc(100vw - 40px));max-height:88dvh;border-radius:20px;}
}
@media (max-width:380px){
  :root{--pad:10px;--gap:10px;--radius:14px;}
  h1{font-size:17px}
  .top{gap:6px}
  .btn.small{padding:7px 10px;font-size:13px}
  .icon-btn{width:36px;height:36px}
  .card-head{padding:12px}
  .card-body{padding:0 12px 12px}
  .card h2{font-size:16px}
  .desc{font-size:13.5px}
  .modal{padding:14px}
  .modal-actions{flex-direction:column-reverse}
  .modal-actions .btn,.modal-actions .danger{width:100%}
}
@media (max-height:520px) and (orientation:landscape){
  :root{--header-pad-top:6px;}
  header{padding-bottom:4px}
  .card-head{padding:10px 14px}
  .card-body{padding:0 14px 10px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>

<script type="module">
// ============================================
// БЛОК 1. ТВОИ ДАННЫЕ FIREBASE (ЗАМЕНИ!)
// ============================================
// Где взять: Firebase Console → шестерёнка (Project settings) → General → Your apps → SDK setup and configuration → Config
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDEHif3aB05Q7afZYdx4AE66qNH4ObnhhY",
  authDomain: "pomoshnik-prodavca.firebaseapp.com",
  projectId: "pomoshnik-prodavca",
  storageBucket: "pomoshnik-prodavca.firebasestorage.app",
  messagingSenderId: "493490305518",
  appId: "1:493490305518:web:7679490e482b066c3276ff",
  measurementId: "G-EB23E29XVW"
};

// Где взять: Firebase Console → Authentication → Users → колонка "User UID"
const ADMIN_UID = "j3qe8ZSSYzb6cR3mZ6BfvPX8yrB2";

// ============================================
// БЛОК 2. ИМПОРТЫ FIREBASE (НЕ ТРОГАЙ)
// ============================================
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, enableIndexedDbPersistence, query, orderBy } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

enableIndexedDbPersistence(db).catch((err) => {
  console.log('Офлайн-кеш:', err.code);
});

// ============================================
// БЛОК 3. СОСТОЯНИЕ (НЕ ТРОГАЙ)
// ============================================
let products = [];
let isAdmin = false;
let activeCat = 'Все';
let queryText = '';
let editingId = null;
let openIds = new Set();
let lastFocused = null;
const searchCache = new WeakMap();

// ============================================
// БЛОК 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (НЕ ТРОГАЙ)
// ============================================
function genId(){
  if(window.crypto && crypto.randomUUID) return 'p'+crypto.randomUUID();
  return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function normalizeProduct(raw){
  if(!raw || typeof raw !== 'object') return null;
  const name = typeof raw.name === 'string' ? raw.name.trim() : '';
  if(!name) return null;
  const id = (typeof raw.id === 'string' && raw.id.trim()) ? raw.id.trim() : genId();
  const category = (typeof raw.category === 'string' && raw.category.trim()) ? raw.category.trim() : 'Без категории';
  const desc = typeof raw.desc === 'string' ? raw.desc : '';
  const specs = Array.isArray(raw.specs)
    ? raw.specs.map(s=>{
        if(!s || typeof s !== 'object') return null;
        const k = typeof s.k === 'string' ? s.k.trim() : '';
        const v = typeof s.v === 'string' ? s.v.trim() : '';
        if(!k && !v) return null;
        return {k, v};
      }).filter(Boolean)
    : [];
  const features = Array.isArray(raw.features)
    ? raw.features.map(f=>{
        if(!f) return null;
        if(typeof f === 'string') return {t:f.trim(), d:''};
        const t = typeof f.t === 'string' ? f.t.trim() : '';
        const d = typeof f.d === 'string' ? f.d.trim() : '';
        if(!t && !d) return null;
        return {t, d};
      }).filter(Boolean)
    : [];
  const pros = Array.isArray(raw.pros) ? raw.pros.map(x=>String(x||'').trim()).filter(Boolean) : [];
  const cons = Array.isArray(raw.cons) ? raw.cons.map(x=>String(x||'').trim()).filter(Boolean) : [];
  return {id, name, category, desc, specs, features, pros, cons};
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, isErr){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 2200);
}

// ============================================
// БЛОК 5. ЗАГРУЗКА ИЗ FIRESTORE (НЕ ТРОГАЙ)
// ============================================
async function loadProductsFromFirestore(){
  try{
    const q = query(collection(db, 'products'), orderBy('name'));
    const snapshot = await getDocs(q);
    const loaded = [];
    snapshot.forEach(docSnap => {
      const norm = normalizeProduct({ ...docSnap.data(), id: docSnap.id });
      if(norm) loaded.push(norm);
    });
    products = loaded;
    renderAll();
  }catch(e){
    console.error('Ошибка загрузки:', e);
    toast('Не удалось загрузить товары. Проверьте соединение.', true);
    renderAll();
  }
}

// ============================================
// БЛОК 6. СОХРАНЕНИЕ В FIRESTORE (НЕ ТРОГАЙ)
// ============================================
async function saveProductToFirestore(product){
  if(!isAdmin){ toast('Только администратор может сохранять', true); return false; }
  try{
    const { id, ...data } = product;
    await setDoc(doc(db, 'products', id), data);
    return true;
  }catch(e){
    console.error('Ошибка сохранения:', e);
    toast('Ошибка сохранения. Проверьте сеть.', true);
    return false;
  }
}

async function deleteProductFromFirestore(id){
  if(!isAdmin){ toast('Только администратор может удалять', true); return false; }
  try{
    await deleteDoc(doc(db, 'products', id));
    return true;
  }catch(e){
    console.error('Ошибка удаления:', e);
    toast('Ошибка удаления. Проверьте сеть.', true);
    return false;
  }
}

// ============================================
// БЛОК 7. РЕНДЕР (НЕ ТРОГАЙ)
// ============================================
function allCats(){
  const map = new Map();
  const DEFAULT_CATS = ['Телефоны','Ноутбуки','Компьютеры','Телевизоры','Наушники','Игровые приставки','Саундбары','Клавиатуры','Мышки игровые'];
  DEFAULT_CATS.forEach(c=>map.set(c.toLowerCase(), c));
  products.forEach(p=>{ if(p.category){ const key = p.category.toLowerCase(); if(!map.has(key)) map.set(key, p.category); } });
  return [...map.values()];
}

function renderChips(){
  const cats = ['Все', ...allCats()];
  document.getElementById('chips').innerHTML = cats.map(c=>
    `<div class="chip ${c===activeCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</div>`).join('');
}

function getHay(p){
  let hay = searchCache.get(p);
  if(hay) return hay;
  hay = [p.name, p.category, p.desc, ...(p.specs||[]).map(s=>s.k+' '+s.v), ...(p.features||[]).map(f=>f.t+' '+f.d), ...(p.pros||[]), ...(p.cons||[])].join(' ').toLowerCase();
  searchCache.set(p, hay);
  return hay;
}

function productMatches(p){
  if(activeCat!=='Все' && p.category!==activeCat) return false;
  if(!queryText) return true;
  return getHay(p).includes(queryText.toLowerCase());
}

function renderList(){
  const list = products.filter(productMatches);
  document.getElementById('count').textContent = list.length ? `Товаров: ${list.length}` : '';
  const box = document.getElementById('list');
  if(!list.length){
    box.innerHTML = `<div class="empty">Ничего не найдено.<br>${isAdmin ? 'Добавьте товар кнопкой «+ Товар».' : ''}</div>`;
    return;
  }
  box.innerHTML = list.map(p=>`
    <div class="card ${openIds.has(p.id)?'open':''}" data-id="${esc(p.id)}">
      <div class="card-head" data-toggle="${esc(p.id)}">
        <div class="info">
          <span class="badge">${esc(p.category||'Без категории')}</span>
          <h2>${esc(p.name)}</h2>
          <div class="desc">${esc(p.desc)}</div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="card-body">
        ${(p.features&&p.features.length)?`<div class="block"><h3>Фишки</h3>${p.features.map(f=>`<div class="feat"><b>${esc(f.t)}</b><span>${esc(f.d)}</span></div>`).join('')}</div>`:''}
        ${(p.specs&&p.specs.length)?`<div class="block"><h3>Характеристики</h3>${p.specs.map(s=>`<div class="feat"><b>${esc(s.k)}</b><span>${esc(s.v)}</span></div>`).join('')}</div>`:''}
        ${(p.pros&&p.pros.length)?`<div class="block"><h3>Сильные стороны</h3><ul class="pluses">${p.pros.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
        ${(p.cons&&p.cons.length)?`<div class="block"><h3>Слабые стороны</h3><ul class="minuses">${p.cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
        ${isAdmin ? `<div class="card-actions"><button class="btn secondary small" data-edit="${esc(p.id)}">Редактировать</button></div>` : ''}
      </div>
    </div>`).join('');
}

function renderAll(){ renderChips(); renderList(); fillDatalist(); }

function fillDatalist(){
  document.getElementById('catList').innerHTML = allCats().map(c=>`<option value="${esc(c)}">`).join('');
}

// ============================================
// БЛОК 8. ФОРМА (НЕ ТРОГАЙ)
// ============================================
function openForm(id){
  if(!isAdmin){ toast('Только администратор может редактировать', true); return; }
  editingId = id || null;
  const m = document.getElementById('modal'), o = document.getElementById('overlay');
  const title = document.getElementById('modalTitle');
  const del = document.getElementById('deleteBtn');
  if(id){
    const p = products.find(x=>x.id===id);
    if(!p) return;
    title.textContent = 'Редактировать товар';
    document.getElementById('fName').value = p.name||'';
    document.getElementById('fCategory').value = p.category||'';
    document.getElementById('fDesc').value = p.desc||'';
    document.getElementById('fFeatures').value = (p.features||[]).map(f=>f.d ? (f.t+' — '+f.d) : f.t).join('\n');
    document.getElementById('fSpecs').value = (p.specs||[]).map(s=>s.v ? (s.k+': '+s.v) : s.k).join('\n');
    document.getElementById('fPros').value = (p.pros||[]).join('\n');
    document.getElementById('fCons').value = (p.cons||[]).join('\n');
    del.style.display='block';
  } else {
    title.textContent = 'Новый товар';
    ['fName','fCategory','fDesc','fFeatures','fSpecs','fPros','fCons'].forEach(i=>document.getElementById(i).value='');
    del.style.display='none';
  }
  lastFocused = document.activeElement;
  m.classList.add('show'); o.classList.add('show');
  setTimeout(()=>document.getElementById('fName').focus(), 50);
}

function closeForm(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  editingId = null;
  if(lastFocused && lastFocused.focus) lastFocused.focus();
}

function parseLines(text){ return text.split('\n').map(s=>s.trim()).filter(Boolean); }
function parseFeatures(text){
  return parseLines(text).map(line=>{
    const m = line.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    return m ? {t:m[1].trim(), d:m[2].trim()} : {t:line, d:''};
  });
}
function parseSpecs(text){
  return parseLines(text).map(line=>{
    const m = line.match(/^(.+?)\s*[:—–-]\s*(.+)$/);
    return m ? {k:m[1].trim(), v:m[2].trim()} : {k:line, v:''};
  });
}

async function saveForm(){
  if(!isAdmin){ toast('Только администратор', true); return; }
  const name = document.getElementById('fName').value.trim();
  if(!name){ toast('Введите название товара', true); return; }
  const data = {
    name,
    category: document.getElementById('fCategory').value.trim() || 'Без категории',
    desc: document.getElementById('fDesc').value.trim(),
    features: parseFeatures(document.getElementById('fFeatures').value),
    specs: parseSpecs(document.getElementById('fSpecs').value),
    pros: parseLines(document.getElementById('fPros').value),
    cons: parseLines(document.getElementById('fCons').value)
  };
  let product;
  if(editingId){
    product = { id: editingId, ...data };
  } else {
    product = { id: genId(), ...data };
  }
  const ok = await saveProductToFirestore(product);
  if(ok){
    if(editingId){
      const idx = products.findIndex(p=>p.id===editingId);
      if(idx >= 0){ products[idx] = product; searchCache.delete(products[idx]); }
    } else {
      products.push(product);
    }
    closeForm(); renderAll(); toast('Сохранено');
  }
}

async function deleteCurrent(){
  if(!isAdmin || !editingId) return;
  const id = editingId;
  askConfirm('Удалить этот товар?', async ()=>{
    const ok = await deleteProductFromFirestore(id);
    if(ok){
      products = products.filter(p=>p.id!==id);
      openIds.delete(id);
      closeForm(); renderAll(); toast('Удалено');
    }
  });
}

// ============================================
// БЛОК 9. ПОДТВЕРЖДЕНИЕ (НЕ ТРОГАЙ)
// ============================================
let confirmCb = null;
function askConfirm(text, cb){
  document.getElementById('confirmText').textContent = text;
  confirmCb = cb;
  document.getElementById('confirmDlg').classList.add('show');
}
document.getElementById('confirmYes').onclick = ()=>{ const cb = confirmCb; confirmCb = null; document.getElementById('confirmDlg').classList.remove('show'); if(cb) cb(); };
document.getElementById('confirmNo').onclick = ()=>{ confirmCb = null; document.getElementById('confirmDlg').classList.remove('show'); };

// ============================================
// БЛОК 10. АВТОРИЗАЦИЯ
// ============================================
document.getElementById('loginBtn').onclick = ()=>{
  document.getElementById('loginDlg').classList.add('show');
};

document.getElementById('loginSubmit').onclick = async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ toast('Введите email и пароль', true); return; }
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    document.getElementById('loginDlg').classList.remove('show');
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPass').value = '';
    toast('Вы вошли как администратор');
  }catch(e){
    toast('Неверный email или пароль', true);
  }
};

document.getElementById('loginCancel').onclick = ()=>{
  document.getElementById('loginDlg').classList.remove('show');
};

document.getElementById('logoutBtn').onclick = async ()=>{
  await signOut(auth);
  toast('Вы вышли');
};

onAuthStateChanged(auth, (user) => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  document.getElementById('addBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('importBtn').style.display = isAdmin ? '' : 'none';
  document.getElementById('loginBtn').style.display = isAdmin ? 'none' : '';
  document.getElementById('logoutBtn').style.display = isAdmin ? '' : 'none';
  renderAll();
});

// ============================================
// БЛОК 11. ЭКСПОРТ / ИМПОРТ (ТОЛЬКО АДМИН)
// ============================================
document.getElementById('exportBtn').onclick = ()=>{
  if(!isAdmin){ toast('Только администратор', true); return; }
  const blob = new Blob([JSON.stringify(products,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pomoshnik-prodavca-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

let pendingImport = null;
document.getElementById('importBtn').onclick = ()=>{
  if(!isAdmin) return;
  document.getElementById('importFile').click();
};
document.getElementById('importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const arr = JSON.parse(r.result);
      if(!Array.isArray(arr)) throw new Error('bad');
      const norm = arr.map(normalizeProduct).filter(Boolean);
      if(!norm.length){ toast('В файле нет корректных товаров', true); return; }
      pendingImport = norm;
      document.getElementById('importText').textContent = `В файле товаров: ${norm.length}. Сейчас: ${products.length}. Что сделать?`;
      document.getElementById('importDlg').classList.add('show');
    }catch(err){ toast('Не удалось прочитать файл', true); }
  };
  r.readAsText(f);
  e.target.value='';
});

document.getElementById('importMerge').onclick = async ()=>{
  if(!pendingImport || !isAdmin) return;
  let added = 0;
  for(const p of pendingImport){
    if(!products.find(x=>x.id===p.id)){
      const ok = await saveProductToFirestore(p);
      if(ok){ products.push(p); added++; }
    }
  }
  pendingImport = null;
  document.getElementById('importDlg').classList.remove('show');
  renderAll(); toast(added ? `Добавлено: ${added}` : 'Новых товаров нет');
};

document.getElementById('importReplace').onclick = async ()=>{
  if(!pendingImport || !isAdmin) return;
  for(const p of products){
    await deleteProductFromFirestore(p.id);
  }
  products = [];
  let added = 0;
  for(const p of pendingImport){
    const ok = await saveProductToFirestore(p);
    if(ok){ products.push(p); added++; }
  }
  pendingImport = null;
  document.getElementById('importDlg').classList.remove('show');
  renderAll(); toast(`Заменено. Товаров: ${added}`);
};

document.getElementById('importCancel').onclick = ()=>{ pendingImport = null; document.getElementById('importDlg').classList.remove('show'); };

// ============================================
// БЛОК 12. ПОИСК / ЧИПСЫ / КАРТОЧКИ
// ============================================
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', e=>{
  const val = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ queryText = val; renderList(); }, 150);
});

document.getElementById('chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  activeCat = chip.dataset.cat; renderChips(); renderList();
});

document.getElementById('list').addEventListener('click', e=>{
  const edit = e.target.closest('[data-edit]');
  if(edit){ openForm(edit.dataset.edit); return; }
  const head = e.target.closest('[data-toggle]');
  if(head){
    const id = head.dataset.toggle;
    const card = head.closest('.card');
    if(card.classList.contains('open')){ card.classList.remove('open'); openIds.delete(id); }
    else { card.classList.add('open'); openIds.add(id); }
  }
});

document.getElementById('addBtn').onclick = ()=>openForm();
document.getElementById('cancelBtn').onclick = closeForm;
document.getElementById('overlay').onclick = closeForm;
document.getElementById('saveBtn').onclick = saveForm;
document.getElementById('deleteBtn').onclick = deleteCurrent;

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(document.getElementById('modal').classList.contains('show')) closeForm();
    if(document.getElementById('confirmDlg').classList.contains('show')){ confirmCb = null; document.getElementById('confirmDlg').classList.remove('show'); }
    if(document.getElementById('importDlg').classList.contains('show')){ pendingImport = null; document.getElementById('importDlg').classList.remove('show'); }
    if(document.getElementById('loginDlg').classList.contains('show')){ document.getElementById('loginDlg').classList.remove('show'); }
  }
});

// ============================================
// БЛОК 13. ТЕМА
// ============================================
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==='dark' ? '#070b14' : '#4f6df5';
  localStorage.setItem('sellerHelperTheme', t);
}
applyTheme(localStorage.getItem('sellerHelperTheme') || 'light');
document.getElementById('themeBtn').onclick = ()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
};

// ============================================
// БЛОК 14. СТАРТ
// ============================================
loadProductsFromFirestore();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
